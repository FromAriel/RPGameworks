name: Player shell source
on:
  push:
    branches: [work/player-shell]
    paths: [.github/workflows/shell-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD -o source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: player-shell-source
          path: source.tar
          retention-days: 2
