name: Foundation checks
on:
  push:
    branches: [main, work/m1-foundation, work/node24-compat, work/m1-maps, work/input-controller, work/controller-recovery, work/mousejoy-parity, work/m1-interactions, work/player-shell, work/w1-base-skin, work/m1-baseline]
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-node22
            os: ubuntu-24.04
            node: '22.16.0'
          - label: linux-node24
            os: ubuntu-24.04
            node: '24.15.0'
          - label: windows-node24
            os: windows-2022
            node: '24.15.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Match the reported npm version on Node 24
        if: matrix.node == '24.15.0'
        run: npm install --global npm@11.6.2
      - name: Install the committed lockfile including build tools
        run: npm ci --include=dev
      - name: Record environment
        run: |
          node --version
          npm --version
          npm ls --depth=0
      - name: Typecheck, domain tests, and production build
        run: npm run check
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Production browser tests, including the project subpath
        run: npm run test:browser
      - name: Record reproducible baseline (timings are evidence, not FPS gates)
        env:
          BENCHMARK_HOST_LABEL: ${{ matrix.label }}
        run: npm run benchmark
      - name: Upload measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-evidence-${{ matrix.label }}
          path: |
            benchmark-results/
            benchmark-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Build portable static artifact
        run: npm run build
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.label }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload static browser build
        uses: actions/upload-artifact@v4
        with:
          name: browser-build-${{ matrix.label }}
          path: dist/
          retention-days: 14
