name: Controller repair source
on:
  push:
    branches: [work/controller-recovery]
    paths: [.github/workflows/recovery-source.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: controller-recovery-source
          path: source.tar.gz
          retention-days: 2
