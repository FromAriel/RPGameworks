name: Input workspace
on:
  push:
    branches: [work/input-controller]
    paths: [.github/workflows/input-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Export tracked source
        run: |
          mkdir -p /tmp/input-workspace
          git archive HEAD | gzip > /tmp/input-workspace/source.tar.gz
          git rev-parse HEAD > /tmp/input-workspace/source-revision.txt
      - run: npm ci --include=dev
      - name: Export installed dependencies
        run: tar -czf /tmp/input-workspace/dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: input-workspace
          path: /tmp/input-workspace/
          retention-days: 2
