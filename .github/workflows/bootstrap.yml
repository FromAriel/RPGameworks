name: Foundation dependency bootstrap
on:
  push:
    branches: [work/m1-foundation]
    paths: [.github/workflows/bootstrap.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/m1-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Resolve and pin real registry packages
        run: |
          npm install --save-exact phaser@4.2.1
          npm install --save-dev --save-exact typescript@7.0.2 vite@latest vitest@latest @playwright/test@1.63.0 @types/node@22
          npm ls --depth=0
          node --version
          npm --version
      - name: Preserve generated manifests on the work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'build: pin registry-resolved foundation dependencies and generated lockfile'
          git push origin HEAD:work/m1-foundation
