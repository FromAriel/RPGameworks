name: Interaction source
on:
  push:
    branches: [work/m1-interactions]
    paths: [.github/workflows/interaction-source.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: interaction-source
          path: source.tar.gz
          retention-days: 2
