name: MouseJoy comparison source
on:
  push:
    branches: [work/mousejoy-parity]
    paths: [.github/workflows/parity-source.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: mousejoy-current-source
          path: source.tar.gz
          retention-days: 2
