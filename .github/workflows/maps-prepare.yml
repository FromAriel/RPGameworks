name: Map schema preparation
on:
  push:
    branches: [work/m1-maps]
    paths: [.github/workflows/maps-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Add pinned build-time schema tools without upgrading existing dependencies
        run: |
          cp package-lock.json /tmp/previous-lock.json
          npm ci --include=dev
          npm install --save-dev --save-exact ajv@8 json-schema-to-typescript@15
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const before = JSON.parse(readFileSync('/tmp/previous-lock.json', 'utf8'));
          const after = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          for (const [name, item] of Object.entries(before.packages)) {
            if (!name) continue;
            assert.equal(after.packages[name]?.version, item.version, `Unexpected upgrade: ${name}`);
            assert.equal(after.packages[name]?.integrity, item.integrity, `Unexpected integrity change: ${name}`);
          }
          console.log('Existing package versions and integrity hashes preserved.');
          NODE
          npm ls --depth=0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'build: pin map validation and schema type generation tools'
          git push origin HEAD:work/m1-maps
      - name: Export source and local verification dependencies
        run: |
          git archive --format=tar.gz HEAD > /tmp/source.tar.gz
          tar -czf /tmp/dependencies.tar.gz node_modules
          git rev-parse HEAD > /tmp/source-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m1-map-workspace
          path: |
            /tmp/source.tar.gz
            /tmp/dependencies.tar.gz
            /tmp/source-revision.txt
          retention-days: 2
